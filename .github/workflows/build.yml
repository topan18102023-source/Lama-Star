
name: Build APK LAMA STAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          unzip -q LAMA_STAR_Flutter_Starter.zip -d starter
          PROJECT_FILE=$(find starter -name pubspec.yaml -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Create Android platform
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.lamastar .

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAMA-STAR-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
